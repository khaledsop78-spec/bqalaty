<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بقالتي</title>
<script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 15px;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-button {
            background: #222;
            color: white;
        }

        .scan-button {
            background: #1976d2;
            color: white;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }

        .product button {
            width: auto;
            margin: 0;
            padding: 8px 12px;
        }

        .delete-button {
            background: #e53935;
            color: white;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>🛒 بقالتي</h1>

    <!-- السلة -->
    <div class="card">
        <h2>السلة</h2>
<button class="scan-button" onclick="startScanner()">
    📷 مسح الباركود
</button>

<div id="scanner"
     style="width:100%;display:none;border-radius:12px;overflow:hidden">
</div>
    <button onclick="listAvailableCameras()"
        style="width:100%;padding:12px;margin:10px 0">
    📷 فحص العدسات المتاحة
    </button>    
<div id="zoomControls" style="display:none;gap:10px;margin:10px 0">
    <button onclick="setCameraZoom(2)">تكبير 2×</button>
    <button onclick="setCameraZoom(1)">رجوع 1×</button>
</div>
</button>
<button onclick="stopScanner()"
        id="stopScanner"
        style="display:none">
    إيقاف الكاميرا
</button>
        <div id="cart"></div>

        <div class="total">
            الإجمالي: <span id="total">0.00</span> ريال
        </div>

        <button onclick="clearCart()">
            مسح السلة
        </button>
    </div>

    <!-- إضافة منتج -->
    <div class="card">
        <h2>إضافة منتج</h2>

        <input
            type="text"
            id="barcode"
            placeholder="باركود المنتج"
        >

        <input
            type="text"
            id="name"
            placeholder="اسم المنتج"
        >

        <input
            type="number"
            id="price"
            placeholder="السعر"
            step="0.01"
        >

        <button
            class="save-button"
            onclick="addProduct()"
        >
            حفظ المنتج
        </button>
    </div>

    <!-- المنتجات -->
    <div class="card">
        <h2>المنتجات المسجلة</h2>

        <div id="products"></div>
    </div>

    <script>

        // المنتجات المحفوظة على الجهاز
        let products = JSON.parse(
            localStorage.getItem("products") || "{}"
        );

        // السلة
        let cart = [];


        // حفظ المنتجات
        function saveProducts() {
            localStorage.setItem(
                "products",
                JSON.stringify(products)
            );
        }


        // إضافة منتج جديد
        function addProduct() {

            const barcode =
                document.getElementById("barcode").value.trim();

            const name =
                document.getElementById("name").value.trim();

            const price =
                parseFloat(
                    document.getElementById("price").value
                );

            if (!barcode || !name || isNaN(price)) {
                alert("أدخل الباركود والاسم والسعر.");
                return;
            }

            products[barcode] = {
                name: name,
                price: price
            };

            saveProducts();
            showProducts();

            document.getElementById("barcode").value = "";
            document.getElementById("name").value = "";
            document.getElementById("price").value = "";

            alert("تم حفظ المنتج بنجاح.");
        }


        // عرض المنتجات
        function showProducts() {

            const container =
                document.getElementById("products");

            container.innerHTML = "";

            for (const barcode in products) {

                const product = products[barcode];

                const div = document.createElement("div");

                div.className = "product";

                div.innerHTML = `
                    <div>
                        <strong>${product.name}</strong><br>
                        الباركود: ${barcode}<br>
                        السعر: ${product.price.toFixed(2)} ريال
                    </div>
                   <button
    onclick="addToCart('${barcode}')"
>
    إضافة للسلة
</button>

<button
    class="delete-button"
    onclick="deleteProduct('${barcode}')"
>
    حذف
</button>
                `;

                container.appendChild(div);
            }
        }


        // إضافة منتج إلى السلة
        function addToCart(barcode) {

            if (!products[barcode]) {
                alert("هذا المنتج غير مسجل.");
                return;
            }

            cart.push(products[barcode]);

            showCart();
        }


        // عرض السلة
        function showCart() {

            const container =
                document.getElementById("cart");

            const totalElement =
                document.getElementById("total");

            container.innerHTML = "";

            let total = 0;

            cart.forEach((product) => {

                const div = document.createElement("div");

                div.className = "product";

                div.innerHTML = `
                    <div>
                        ${product.name}
                    </div>

                    <div>
                        ${product.price.toFixed(2)} ريال
                    </div>
                `;

                container.appendChild(div);

                total += product.price;
            });

            totalElement.textContent =
                total.toFixed(2);
        }


        // حذف منتج من المنتجات المسجلة
        function deleteProduct(barcode) {

            delete products[barcode];

            saveProducts();
            showProducts();
        }


        // مسح السلة
        function clearCart() {

            cart = [];

            showCart();
        }

// قارئ الباركود
// قارئ الباركود والتحكم بالكاميرا

let html5QrCode = null;
let scannerRunning = false;

let lastCandidate = "";
let sameCandidateCount = 0;

// التحقق من صحة باركود EAN-13
function isValidEAN13(code) {
    if (!/^\d{13}$/.test(code)) return false;

    const digits = code.split("").map(Number);

    let sum = 0;

    for (let i = 0; i < 12; i++) {
        sum += digits[i] * (i % 2 === 0 ? 1 : 3);
    }

    const checkDigit = (10 - (sum % 10)) % 10;

    return checkDigit === digits[12];
}
async function listAvailableCameras() {
    try {
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
            alert("لم يتم العثور على كاميرات");
            return;
        }

        let result = "الكاميرات المتاحة:\n\n";

        cameras.forEach((camera, index) => {
            result +=
                (index + 1) + ". " +
                (camera.label || "كاميرا بدون اسم") +
                "\n\n";
        });

        result += "عدد الكاميرات: " + cameras.length;

        alert(result);

    } catch (error) {
        alert("تعذر فحص الكاميرات: " + error.message);
    }
}
        
async function startScanner() {
    const scanner = document.getElementById("scanner");
    const stopButton = document.getElementById("stopScanner");

    try {
        lastCandidate = "";
        sameCandidateCount = 0;

        scanner.style.display = "block";
        stopButton.style.display = "block";
document.getElementById("zoomControls").style.display = "flex";
        html5QrCode = new Html5Qrcode(
            "scanner",
            {
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13
                ]
            }
        );

        scannerRunning = true;

        await html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 12,

                qrbox: (width, height) => ({
                    width: Math.min(width - 30, 360),
                    height: Math.min(height - 30, 140)
                }),

                videoConstraints: {
                    facingMode: { ideal: "environment" },

                    width: {
                        min: 720,
                        ideal: 1080
                    },

                    height: {
                        min: 1280,
                        ideal: 1920
                    },

                    frameRate: {
                        ideal: 30
                    }
                }
            },

            async (decodedText) => {
                if (!scannerRunning) return;

                const barcode = decodedText.trim();

                if (!isValidEAN13(barcode)) {
                    lastCandidate = "";
                    sameCandidateCount = 0;
                    return;
                }

                if (barcode === lastCandidate) {
                    sameCandidateCount++;
                } else {
                    lastCandidate = barcode;
                    sameCandidateCount = 1;
                }

                if (sameCandidateCount >= 2) {
                    scannerRunning = false;

                    await stopScanner();

                    addToCart(barcode);
                }
            },

            () => {}
        );

        const settings =
            html5QrCode.getRunningTrackSettings();

        alert(
            "دقة الكاميرا بعد التعديل:\n" +
            settings.width + " × " + settings.height
        );

    } catch (error) {
        scannerRunning = false;

        alert("تعذر تشغيل الكاميرا: " + error);

        await stopScanner();
    }
}

async function setCameraZoom(level) {
    try {
        const capabilities =
            html5QrCode.getRunningTrackCapabilities();

        if (!capabilities.zoom) {
            alert("الكاميرا لا تدعم التكبير");
            return;
        }

        const zoom = Math.max(
            capabilities.zoom.min,
            Math.min(level, capabilities.zoom.max)
        );

        await html5QrCode.applyVideoConstraints({
            advanced: [{ zoom: zoom }]
        });

        alert("تم ضبط التكبير على " + zoom + "×");

    } catch (error) {
        alert("تعذر تغيير التكبير: " + error.message);
    }
}
async function stopScanner() {
    scannerRunning = false;

    if (html5QrCode) {
        try {
            if (html5QrCode.isScanning) {
                await html5QrCode.stop();
            }

            await html5QrCode.clear();

        } catch (error) {
            console.log(error);
        }

        html5QrCode = null;
    }

    document.getElementById("scanner").style.display = "none";

   document.getElementById("stopScanner").style.display = "none";

    document.getElementById("zoomControls").style.display = "none";
}

    </script>

</body>
</html>
